# Builds the website (website/) and deploys it to Cloudflare Pages on every push to main.
# One-time setup: add the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see website/README.md).
# Until they exist the run succeeds with a warning and deploys nothing.
name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: website-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'gazewell' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check Cloudflare credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set, so nothing was deployed. See website/README.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.creds.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Build
        if: steps.creds.outputs.ready == 'true'
        working-directory: website
        run: |
          npm ci
          npm run build

      # Direct Upload needs the Pages project to exist. This is a no-op after the first run.
      - name: Create Pages project if missing
        if: steps.creds.outputs.ready == 'true'
        working-directory: website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler pages project create "$PROJECT" --production-branch=main || echo "Project already exists (or creation failed; the deploy step will say which)."

      - name: Deploy
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy website/out --project-name=${{ env.PROJECT }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
